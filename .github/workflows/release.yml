name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build plugin artifact
        run: npm run build
      - name: Verify version parity
        run: node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("manifest.json","utf8"));const p=JSON.parse(fs.readFileSync("package.json","utf8"));if(m.version!==p.version){console.error("version mismatch: manifest "+m.version+" vs package "+p.version);process.exit(1)}console.log("version parity OK: "+m.version);'
      - name: Collect release assets
        run: |
          mkdir -p dist
          cp main.js manifest.json dist/
          if [ -f styles.css ]; then cp styles.css dist/; fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
